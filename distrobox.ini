[spf]
image=archlinux:latest
additional_packages="base-devel git curl nano aarch64-linux-gnu-gcc prettier markdownlint-cli2 shfmt shellcheck"
init=false
start_now=true
shell=/bin/bash
init_hooks="curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --no-modify-path"
container_user_hooks="sudo chown -R $USER:$USER ~/.rustup ~/.cargo && cargo install cargo-deb cargo-generate-rpm"
