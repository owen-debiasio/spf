[spf-dev]
image=archlinux:latest

# Includes rust, rust aarch64 target, aarch64 compiler, cargo-deb, cargo-generate-rpm, linting tools, and base devel
additional_packages="base-devel git curl nano cargo rust rust-analyzer rust-aarch64-gnu aarch64-linux-gnu-gcc cargo-deb cargo-generate-rpm prettier markdownlint-cli2 shfmt shellcheck"

init=false
start_now=true
shell=/bin/bash

# Let ides find rust analyzer
exported_bins="/usr/bin/rust-analyzer"
