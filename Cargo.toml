[package]
name = "spf"
version = "0.7.0"
description = "Simple package format"
edition = "2024"
authors = ["Owen DeBiasio <owen.debiasio@gmail.com>"]
homepage = "https://github.com/owen-debiasio/spf"
license = "GPL-3.0-or-later"

[dependencies]
ar = "0.9.0"
deb-rs2 = { git = "https://github.com/owen-debiasio/deb-rs2" }
deb-rust = "0.1.2"
file_diff = "1.0.0"
flate2 = "1.1.10"
glob = "0.3.4"
rpm = { version = "0.28.0", default-features = false, features = [
    "chrono",
    "flate2",
    "getrandom",
    "gzip-compression",
    "payload",
    "pgp",
    "signature-meta",
    "signature-pgp"
] }
self-replace = "1.5.0"
tar = "0.4.46"
xz2 = "0.1.7"

[profile.release]
lto = true
codegen-units = 1

[package.metadata.deb]
maintainer = "Owen DeBiasio <owen.debiasio@gmail.com>"
copyright = "2026, Owen DeBiasio"
license-file = ["LICENSE", "4"]
depends = "$auto"
section = "utility"
priority = "optional"
assets = [
    ["target/release/spf", "usr/bin/spf", "755"],
    ["LICENSE", "usr/share/doc/spf/copyright", "644"],
    ["changes.md", "usr/share/doc/spf/changes.md", "644"],
    ["README.md", "usr/share/doc/spf/README.md", "644"],
]

[package.metadata.generate-rpm]
auto-req = "auto"
group = "Applications/Utilities"
release = "1"
assets = [
    { source = "target/release/spf", dest = "/usr/bin/spf", mode = "755" },
    { source = "LICENSE", dest = "/usr/share/doc/spf/copyright", mode = "644" },
    { source = "changes.md", dest = "/usr/share/doc/spf/changes.md", mode = "644" },
    { source = "README.md", dest = "/usr/share/doc/spf/README.md", mode = "644" },
]
